<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <!-- Journal Book Icon with pen -->
    <g transform="translate(228, 228)">
        <!-- Book/Journal -->
        <g transform="translate(-85, -70)">
            <!-- Book pages -->
            <rect x="10" y="0" width="140" height="180" rx="8" fill="#ffffff" opacity="0.95"/>
            
            <!-- Book cover left side -->
            <rect x="0" y="-5" width="20" height="190" rx="6" fill="#fbbf24" opacity="0.9"/>
            
            <!-- Horizontal lines (ruled paper effect) -->
            <line x1="25" y1="30" x2="135" y2="30" stroke="#e5e7eb" stroke-width="3"/>
            <line x1="25" y1="50" x2="135" y2="50" stroke="#e5e7eb" stroke-width="3"/>
            <line x1="25" y1="70" x2="135" y2="70" stroke="#e5e7eb" stroke-width="3"/>
            <line x1="25" y1="90" x2="120" y2="90" stroke="#e5e7eb" stroke-width="3"/>
            <line x1="25" y1="110" x2="135" y2="110" stroke="#e5e7eb" stroke-width="3"/>
            <line x1="25" y1="130" x2="110" y2="130" stroke="#e5e7eb" stroke-width="3"/>
            <line x1="25" y1="150" x2="135" y2="150" stroke="#e5e7eb" stroke-width="3"/>
            
            <!-- Book spine detail -->
            <line x1="10" y1="0" x2="10" y2="180" stroke="#f59e0b" stroke-width="2" opacity="0.7"/>
        </g>
        
        <!-- Pen -->
        <g transform="translate(30, 50) rotate(-45)">
            <!-- Pen body -->
            <rect x="0" y="-4" width="70" height="8" rx="2" fill="#3b82f6"/>
            
            <!-- Pen tip -->
            <polygon points="70,-4 70,4 80,0" fill="#1e40af"/>
            
            <!-- Pen clip -->
            <rect x="8" y="-6" width="3" height="6" rx="1" fill="#93c5fd"/>
        </g>
    </g>
</svg>
