<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Journal</title>
    <base href="/" />
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="journalstart.styles.css" />
    <link rel="icon" href="data:,">
    <style>
        /* Splash screen styles */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #6366f1 50%, #818cf8 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.5s ease-out;
        }
        #splash-screen.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .splash-icon {
            width: 120px;
            height: 120px;
            margin-bottom: 24px;
            animation: pulse 2s ease-in-out infinite;
        }
        .splash-title {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 8px;
        }
        .splash-subtitle {
            font-family: 'Plus Jakarta Sans', 'Segoe UI', sans-serif;
            font-size: 1rem;
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 32px;
        }
        .splash-loader {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
    </style>
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <!-- Splash Screen -->
    <div id="splash-screen">
        <svg class="splash-icon" viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg">
            <g transform="translate(48, 28)">
                <rect x="20" y="0" width="120" height="160" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
                <rect x="20" y="0" width="16" height="160" rx="4" fill="#6366f1"/>
                <line x1="50" y1="35" x2="120" y2="35" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
                <line x1="50" y1="55" x2="120" y2="55" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
                <line x1="50" y1="75" x2="110" y2="75" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
                <line x1="50" y1="95" x2="120" y2="95" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
                <line x1="50" y1="115" x2="95" y2="115" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
                <path d="M115 0 L115 45 L125 35 L135 45 L135 0" fill="#f472b6"/>
            </g>
        </svg>
        <div class="splash-title">Journal</div>
        <div class="splash-subtitle">Your daily companion</div>
        <div class="splash-loader"></div>
    </div>

    <div id="app"></div>

    <!-- <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div> -->

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script>
        // Hide splash screen when Blazor is ready
        Blazor.start().then(function() {
            var splash = document.getElementById('splash-screen');
            if (splash) {
                splash.classList.add('fade-out');
                setTimeout(function() {
                    splash.style.display = 'none';
                }, 500);
            }
        });
    </script>

</body>

</html>
